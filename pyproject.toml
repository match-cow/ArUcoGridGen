[project]
name = "arucogridgen"
version = "0.1.0"
description = "ArUco marker grid generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.28.0",
    "opencv-contrib-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "reportlab>=4.0.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "pdf2image>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

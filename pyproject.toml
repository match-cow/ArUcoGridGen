[project]
name = "arucogridgen"
version = "2.0.0"
description = "Printable calibration board generator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic>=2.11,<3",
  "opencv-contrib-python-headless>=4.10,<5.1",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "Pillow>=11,<13",
  "reportlab>=4.2,<6",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pypdf>=5,<7", "pymupdf>=1.26,<2"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.coverage.run]
omit = ["backend/tests/*"]

services:
  arucogridgen:
    container_name: arucogridgen
    image: ghcr.io/match-cow/arucogridgen:main
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

name: posegridgen

services:
  posegridgen:
    container_name: posegridgen
    image: ghcr.io/match-cow/posegridgen:main
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/api/v2/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
